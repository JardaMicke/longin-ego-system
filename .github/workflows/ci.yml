name: ci

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  python-ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install ".[dev]"
      - name: Run pytest
        run: python -m pytest
      - name: Run ruff
        run: python -m ruff check .
      - name: Run mypy
        run: python -m mypy . --no-incremental

  cortex-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        working-directory: cortex
        run: npm install
      - name: Build cortex UI
        working-directory: cortex
        run: npm run build

  image-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build CI image
        run: docker build -f .github/docker/Dockerfile.ci -t longin-ego-ci:latest .

  deploy-prod:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [python-ci, cortex-build, image-build]
    steps:
      - name: Deploy to production
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT }}
          script: |
            if [ ! -d "${{ secrets.PROD_DEPLOY_PATH }}/.git" ]; then
              git clone https://github.com/JardaMicke/longin-ego-system.git "${{ secrets.PROD_DEPLOY_PATH }}"
            fi
            cd "${{ secrets.PROD_DEPLOY_PATH }}"
            git fetch origin master
            git reset --hard origin/master
            docker compose -f docker-compose.release.yml up -d --build
            curl -fsS http://localhost/v1/health
