services:
  redis:
    image: redis:7.2-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - longin-net
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: longin
      POSTGRES_PASSWORD: longin
      POSTGRES_DB: longin_ego
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - longin-net
  nexus-kernel:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://longin:longin@postgres:5432/longin_ego
    command: ["python", "-c", "import time; time.sleep(10**9)"]
    depends_on:
      - redis
      - postgres
    networks:
      - longin-net
  cortex-ui:
    image: node:20-alpine
    working_dir: /app/cortex
    volumes:
      - ./:/app
    environment:
      POSTGRES_DSN: postgresql://longin:longin@postgres:5432/longin_ego
    command: ["sh", "-c", "npm install && npm run dev"]
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    networks:
      - longin-net

volumes:
  redis-data:
  postgres-data:

networks:
  longin-net:
