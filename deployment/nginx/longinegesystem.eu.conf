
server {
    listen 80;
    server_name www.longinegesystem.eu longinegesystem.eu;
    
    # Automatické přesměrování na HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.longinegesystem.eu longinegesystem.eu;

    # Certifikáty Let's Encrypt (Certbot automaticky vygeneruje)
    ssl_certificate /etc/letsencrypt/live/longinegesystem.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/longinegesystem.eu/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend (Cortex) - Next.js
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Bezpečnostní hlavičky
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";
    }

    # Backend API (Kernel) - FastAPI
    location /api/ {
        # Přepis URL (pokud API běží na rootu v kontejneru)
        rewrite ^/api/(.*) /$1 break;
        
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Prometheus Metriky (chráněno basic auth nebo IP whitelist - zde základní příklad)
    location /metrics/ {
        auth_basic "Metrics Area";
        auth_basic_user_file /etc/nginx/.htpasswd;
        
        proxy_pass http://backend:9000;
    }
    
    # Grafana Dashboard (volitelné)
    location /grafana/ {
        proxy_pass http://grafana:3000/;
        proxy_set_header Host $http_host;
    }
}
