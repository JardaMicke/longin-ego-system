[project]
name = "longin-ego"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "redis>=5.0.1",
    "psutil>=5.9.8",
    "docker>=7.0.0",
    "pydantic>=2.6.0",
    "fastmcp>=0.1.0",
    "httpx>=0.27.0",
    "psycopg[binary]>=3.1.18",
    "fastapi>=0.110.0",
    "uvicorn>=0.29.0",
    "zeroconf>=0.132.0",
    "langgraph>=0.2.0",
    "langgraph-checkpoint-postgres>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
    "mypy>=1.10.0",
    "types-psutil>=5.9.5",
    "types-redis>=4.6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["sdk", "."]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = true
exclude = "tests"

[[tool.mypy.overrides]]
module = [
    "langgraph",
    "langgraph.graph",
    "langgraph.checkpoint.postgres",
]
ignore_missing_imports = true
